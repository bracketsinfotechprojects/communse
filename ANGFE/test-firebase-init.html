<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Initialization Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        #logs { background-color: #f8f9fa; padding: 10px; border: 1px solid #dee2e6; max-height: 300px; overflow-y: auto; }
        .log-entry { margin: 2px 0; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Firebase Initialization Test</h1>
    <div id="status" class="status info">Testing Firebase initialization...</div>
    <div id="logs"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script type="module">
        const statusEl = document.getElementById('status');
        const logsEl = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logsEl.appendChild(logEntry);
            console.log(message);
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        function setStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        // Firebase configuration from environment
        const firebaseConfig = {
            apiKey: "AIzaSyCpg6ePltV5gShCAzGsL0vTvfNCtX_7WTM",
            authDomain: "tempcomm-35dff.firebaseapp.com",
            databaseURL: "https://tempcomm-35dff-default-rtdb.firebaseio.com",
            projectId: "tempcomm-35dff",
            storageBucket: "tempcomm-35dff.firebasestorage.app",
            messagingSenderId: "639642243382",
            appId: "1:639642243382:web:eb5318ca6dbb10f4496397"
        };

        async function testFirebase() {
            try {
                log('Starting Firebase initialization test...');
                setStatus('Initializing Firebase...', 'info');

                // Initialize Firebase
                log('Initializing Firebase app...');
                const app = firebase.initializeApp(firebaseConfig);
                log(`Firebase app initialized: ${app.name}`);

                // Test Auth
                log('Testing Firebase Auth...');
                const auth = firebase.auth();
                log(`Firebase Auth initialized: ${auth.app.name}`);

                // Test Firestore
                log('Testing Firebase Firestore...');
                const firestore = firebase.firestore();
                log(`Firebase Firestore initialized: ${firestore.app.name}`);

                // Test Realtime Database
                log('Testing Firebase Realtime Database...');
                const database = firebase.database();
                log(`Firebase Realtime Database initialized: ${database.app.name}`);

                // Test basic operations
                log('Testing basic Firebase operations...');
                
                // Test Auth state
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    log(`Auth state changed: ${user ? 'User logged in' : 'No user'}`);
                });

                // Test Firestore collection access
                const testDocRef = firestore.collection('test').doc('connection-test');
                await testDocRef.set({
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    message: 'Firebase connection test successful',
                    testId: 'test-' + Date.now()
                });
                log('Firestore write test successful');

                // Test Realtime Database access
                const testDbRef = database.ref('test/connection-test');
                await testDbRef.set({
                    timestamp: Date.now(),
                    message: 'Firebase Realtime Database connection test successful',
                    testId: 'test-' + Date.now()
                });
                log('Realtime Database write test successful');

                // Clean up test data
                await testDocRef.delete();
                await testDbRef.remove();
                log('Test data cleaned up');

                unsubscribe();

                setStatus('✅ All Firebase services initialized and working correctly!', 'success');
                log('🎉 Firebase initialization test completed successfully!', 'success');

            } catch (error) {
                log(`Error during Firebase test: ${error.message}`, 'error');
                log(`Error stack: ${error.stack}`, 'error');
                setStatus(`❌ Firebase initialization failed: ${error.message}`, 'error');
            }
        }

        // Wait for DOM to be ready and Firebase SDKs to load
        window.addEventListener('load', () => {
            log('Page loaded, starting Firebase test...');
            setTimeout(testFirebase, 500);
        });
    </script>
</body>
</html>
