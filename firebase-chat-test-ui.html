<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Chat Test UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.connected {
            background: #27ae60;
        }

        .status.disconnected {
            background: #e74c3c;
        }

        .status.connecting {
            background: #f39c12;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .section {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .section h3 {
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: #357abd;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .chat-area {
            grid-column: 1 / -1;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            max-width: 70%;
        }

        .message.own {
            background: #e3f2fd;
            margin-left: auto;
            border-bottom-right-radius: 3px;
        }

        .message.other {
            background: white;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 3px;
        }

        .message-header {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .chat-input {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .log-area {
            grid-column: 1 / -1;
            border: 1px solid #ddd;
            border-radius: 10px;
            height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-error {
            color: #e74c3c;
        }

        .log-success {
            color: #27ae60;
        }

        .log-info {
            color: #3498db;
        }

        .log-warning {
            color: #f39c12;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 Firebase Chat Test UI</h1>
            <p>Simple interface to test Firebase chat functionality</p>
            <div id="connectionStatus" class="status disconnected">Disconnected</div>
        </div>

        <div class="main-content">
            <!-- Quick Connect -->
            <div class="section">
                <h3>🚀 Quick Connect</h3>
                <div class="form-group">
                    <label>User ID:</label>
                    <input type="text" id="quickUserId" placeholder="Enter user ID">
                </div>
                <div class="form-group">
                    <label>Display Name (optional):</label>
                    <input type="text" id="quickDisplayName" placeholder="Enter your display name">
                </div>
                <div class="form-group">
                    <label>Chat Token (Firebase Custom Token):</label>
                    <input type="text" id="quickToken" placeholder="Enter custom token from backend">
                </div>
                <div class="form-group">
                    <label>Event ID:</label>
                    <input type="text" id="quickEventId" placeholder="Enter event ID" value="test-event-123">
                </div>
                <button class="btn btn-success" onclick="quickConnect()">🚀 Connect to Chat</button>
                <button class="btn btn-danger" onclick="disconnectQuickChat()">Disconnect</button>
                <div id="quickStatus" style="margin-top: 10px; font-weight: bold;"></div>
            </div>

            <!-- Firebase Configuration -->
            <div class="section">
                <h3>⚙️ Firebase Configuration</h3>
                <div class="form-group">
                    <label>API Key:</label>
                    <input type="text" id="apiKey" value="AIzaSyCpg6ePltV5gShCAzGsL0vTvfNCtX_7WTM" readonly>
                </div>
                <div class="form-group">
                    <label>Auth Domain:</label>
                    <input type="text" id="authDomain" value="tempcomm-35dff.firebaseapp.com" readonly>
                </div>
                <div class="form-group">
                    <label>Database URL:</label>
                    <input type="text" id="databaseUrl" value="https://tempcomm-35dff-default-rtdb.firebaseio.com" readonly>
                </div>
                <div class="form-group">
                    <label>Project ID:</label>
                    <input type="text" id="projectId" value="tempcomm-35dff" readonly>
                </div>
                <button class="btn" onclick="initializeFirebase()">Initialize Firebase</button>
            </div>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-header">
                    <div>
                        <strong>Chat Room:</strong> <span id="currentChatRoom">Not connected</span>
                    </div>
                    <div>
                        <span id="messageCount">0 messages</span>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleMessageInput(event)">
                    <button class="btn btn-success" onclick="sendMessage()">Send</button>
                    <button class="btn btn-secondary" onclick="refreshMessages()">🔄 Refresh</button>
                </div>
            </div>

            <!-- Debug Log -->
            <div class="log-area" id="logArea">
                <div class="log-entry log-info">🔥 Firebase Chat Test UI initialized - Use Quick Connect to get started!</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Global variables
        let firebaseApp = null;
        let auth = null;
        let database = null;
        let currentUser = null;
        let messagesRef = null;
        let messagesListener = null;
        let currentEventId = null;

        // Log management
        function log(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logArea.appendChild(logEntry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function updateConnectionStatus(status, text) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.className = `status ${status}`;
            statusElement.textContent = text;
        }

        function updateChatRoom(eventId) {
            document.getElementById('currentChatRoom').textContent = eventId || 'Not connected';
        }

        function updateMessageCount(count) {
            document.getElementById('messageCount').textContent = `${count} messages`;
        }

        // Initialize Firebase
        function initializeFirebase() {
            try {
                const firebaseConfig = {
                    apiKey: document.getElementById('apiKey').value,
                    authDomain: document.getElementById('authDomain').value,
                    databaseURL: document.getElementById('databaseUrl').value,
                    projectId: document.getElementById('projectId').value,
                    storageBucket: "tempcomm-35dff.firebasestorage.app",
                    messagingSenderId: "639642243382",
                    appId: "1:639642243382:web:eb5318ca6dbb10f4496397"
                };

                // Initialize Firebase
                firebaseApp = firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                database = firebase.database();

                log('✅ Firebase initialized successfully', 'success');

                // Enhanced auth state listener
                auth.onAuthStateChanged((user) => {
                    console.log('🔥 Auth state changed:', user ? user.uid : 'null');
                    if (user) {
                        currentUser = user;
                        log(`👤 User authenticated: ${user.uid}`, 'success');
                        updateConnectionStatus('connected', 'Authenticated');
                        
                        // If we're connected to a chat room, refresh the messages
                        if (currentEventId) {
                            log('🔄 Refreshing messages after auth change...', 'info');
                            setTimeout(() => {
                                refreshMessages();
                            }, 500);
                        }
                    } else {
                        currentUser = null;
                        log('👤 User not authenticated', 'info');
                        updateConnectionStatus('disconnected', 'Not Authenticated');
                    }
                });

                // Enhanced database connection testing
                const connectedRef = database.ref('.info/connected');
                connectedRef.on('value', (snapshot) => {
                    if (snapshot.val() === true) {
                        log('📡 Realtime Database connected', 'success');
                    } else {
                        log('📡 Realtime Database disconnected', 'error');
                    }
                });

                // Test basic database access
                database.ref('test_connection').set({
                    timestamp: Date.now(),
                    message: 'Connection test'
                }).then(() => {
                    log('🔍 Database write test successful', 'success');
                    // Clean up test data
                    database.ref('test_connection').remove();
                }).catch((error) => {
                    log(`❌ Database write test failed: ${error.message}`, 'error');
                });

            } catch (error) {
                log(`❌ Firebase initialization failed: ${error.message}`, 'error');
                updateConnectionStatus('disconnected', 'Initialization Failed');
            }
        }

        // Quick Connect function
        function quickConnect() {
            const userId = document.getElementById('quickUserId').value;
            const token = document.getElementById('quickToken').value;
            const eventId = document.getElementById('quickEventId').value;

            if (!userId || !token || !eventId) {
                log('⚠️ User ID, Chat Token, and Event ID are required', 'warning');
                updateQuickStatus('All fields are required', 'red');
                return;
            }

            try {
                log('🚀 Starting quick connect process...', 'info');
                updateQuickStatus('Connecting...', 'blue');

                // First initialize Firebase if not already done
                if (!firebaseApp) {
                    log('🔧 Initializing Firebase...', 'info');
                    initializeFirebase();
                    
                    // Wait a bit for Firebase to initialize
                    setTimeout(async () => {
                        await performQuickConnect(userId, token, eventId);
                    }, 1000);
                } else {
                    performQuickConnect(userId, token, eventId);
                }

            } catch (error) {
                log(`❌ Quick connect failed: ${error.message}`, 'error');
                updateQuickStatus(`Failed: ${error.message}`, 'red');
            }
        }

        async function performQuickConnect(userId, token, eventId) {
            try {
                // Sign in with custom token
                log('🔐 Signing in with custom token...', 'info');
                const userCredential = await auth.signInWithCustomToken(token);
                currentUser = userCredential.user;
                
                log(`✅ Quick connect successful! User: ${currentUser.uid}`, 'success');
                updateQuickStatus(`Connected as: ${currentUser.uid}`, 'green');
                
                // Connect to chat
                await connectToChatRoom(eventId, userId);
                
            } catch (error) {
                log(`❌ Quick connect failed: ${error.message}`, 'error');
                updateQuickStatus(`Failed: ${error.message}`, 'red');
            }
        }

        async function connectToChatRoom(eventId, userId) {
            try {
                log(`💬 Connecting to chat room: ${eventId}...`, 'info');
                
                // Clean up existing listener first
                disconnectFromChat();
                
                currentEventId = eventId;
                messagesRef = database.ref(`event_chats/${eventId}/messages`);
                
                log(`📡 Setting up listener for: event_chats/${eventId}/messages`, 'info');
                
                // Enhanced listener setup with error handling
                messagesListener = messagesRef.on('value', (snapshot) => {
                    console.log('🔥 Firebase listener triggered!', snapshot.val());
                    const data = snapshot.val();
                    if (data) {
                        const messages = Object.entries(data)
                            .map(([id, message]) => ({ id, ...message }))
                            .sort((a, b) => a.timestamp - b.timestamp);
                        
                        log(`📨 Received ${messages.length} messages from Firebase`, 'info');
                        displayMessages(messages);
                        updateMessageCount(messages.length);
                    } else {
                        log('📨 No messages found in Firebase', 'info');
                        displayMessages([]);
                        updateMessageCount(0);
                    }
                }, (error) => {
                    console.error('🔥 Firebase listener error:', error);
                    log(`❌ Firebase listener error: ${error.message}`, 'error');
                });

                // Test the connection immediately
                messagesRef.once('value').then((snapshot) => {
                    log('🔍 Initial data fetch successful', 'success');
                }).catch((error) => {
                    log(`❌ Initial data fetch failed: ${error.message}`, 'error');
                });

                updateChatRoom(eventId);
                log('✅ Connected to chat room successfully', 'success');
                updateConnectionStatus('connected', 'In Chat');
                
            } catch (error) {
                log(`❌ Chat connection failed: ${error.message}`, 'error');
                console.error('Chat connection error:', error);
            }
        }

        function disconnectFromChat() {
            if (messagesListener) {
                messagesRef.off('value', messagesListener);
                messagesListener = null;
                log('🔌 Disconnected from chat messages', 'info');
            }
            
            if (messagesRef) {
                messagesRef = null;
            }
            
            currentEventId = null;
            updateChatRoom('Not connected');
            
            if (currentUser) {
                updateConnectionStatus('connected', 'Authenticated');
            } else {
                updateConnectionStatus('disconnected', 'Not Authenticated');
            }
        }

        function disconnectQuickChat() {
            disconnectFromChat();
            
            // Clear quick connect fields
            document.getElementById('quickUserId').value = '';
            document.getElementById('quickDisplayName').value = '';
            document.getElementById('quickToken').value = '';
            document.getElementById('quickEventId').value = 'test-event-123';
            
            // Reset quick status
            updateQuickStatus('Disconnected', 'red');
            
            log('🔌 Quick chat disconnected', 'info');
        }

        function displayMessages(messages) {
            const messagesContainer = document.getElementById('messages');
            messagesContainer.innerHTML = '';
            
            // FIXED: Use the original user ID from input field for comparison (not Firebase UID)
            // This matches how messages are stored with the original userId
            const originalUserId = document.getElementById('quickUserId').value || 'unknown-user';
            
            console.log('🔍 Displaying messages for original user ID:', originalUserId);
            console.log('🔍 Firebase auth UID:', currentUser?.uid || 'none');
            console.log('🔍 Total messages:', messages.length);
            
            messages.forEach((message, index) => {
                const messageDiv = document.createElement('div');
                const isOwnMessage = message.userId === originalUserId;
                
                console.log(`📝 Message ${index + 1}: userId="${message.userId}" vs current="${originalUserId}" = ${isOwnMessage ? 'OWN' : 'OTHER'}`);
                
                messageDiv.className = `message ${isOwnMessage ? 'own' : 'other'}`;
                
                const timestamp = new Date(message.timestamp).toLocaleTimeString();
                const userDisplayName = message.userName ||
                                      (isOwnMessage ? 'You' : 'Anonymous');
                
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <strong>${userDisplayName}</strong> • ${timestamp}
                        <small style="color: #999;"> (ID: ${message.userId.substring(0, 8)}...)</small>
                    </div>
                    <div class="message-text">${message.text}</div>
                `;
                
                messagesContainer.appendChild(messageDiv);
            });
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const text = messageInput.value.trim();
            
            if (!text || !currentEventId) {
                log('⚠️ Message text and active chat required', 'warning');
                return;
            }

            // FIXED: Use the original user ID consistently (not Firebase UID)
            // This ensures message.userId matches the comparison in displayMessages
            const originalUserId = document.getElementById('quickUserId').value;
            const customDisplayName = document.getElementById('quickDisplayName').value;
            
            // Enhanced display name resolution with fallback to input field name
            const displayName = customDisplayName ||
                               currentUser?.displayName ||
                               currentUser?.email ||
                               (originalUserId ? originalUserId.substring(0, 8) : 'Anonymous');

            if (!originalUserId) {
                log('⚠️ User ID is required', 'warning');
                return;
            }

            console.log('📤 Sending message with original user ID:', originalUserId, 'name:', displayName);
            console.log('📤 Firebase auth UID (for reference):', currentUser?.uid || 'none');

            try {
                const messageData = {
                    text: text,
                    userId: originalUserId,  // Use original user ID consistently
                    userName: displayName,
                    timestamp: Date.now(),
                    eventId: currentEventId
                };
                
                console.log('📤 Pushing message to Firebase:', messageData);
                const newMessageRef = await messagesRef.push(messageData);
                console.log('✅ Message pushed successfully:', newMessageRef.key);
                messageInput.value = '';
                log(`📤 Message sent as ${displayName} (UserID: ${originalUserId.substring(0, 8)}...)`, 'success');
                
            } catch (error) {
                console.error('❌ Send message error:', error);
                log(`❌ Failed to send message: ${error.message}`, 'error');
            }
        }

        function handleMessageInput(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function updateQuickStatus(text, color = 'black') {
            const statusElement = document.getElementById('quickStatus');
            statusElement.style.color = color;
            statusElement.textContent = text;
        }

        // Manual refresh function for troubleshooting
        function refreshMessages() {
            if (!messagesRef || !currentEventId) {
                log('⚠️ No active chat connection to refresh', 'warning');
                return;
            }
            
            log('🔄 Manually refreshing messages...', 'info');
            messagesRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const messages = Object.entries(data)
                        .map(([id, message]) => ({ id, ...message }))
                        .sort((a, b) => a.timestamp - b.timestamp);
                    
                    log(`🔄 Manual refresh: Found ${messages.length} messages`, 'info');
                    displayMessages(messages);
                    updateMessageCount(messages.length);
                } else {
                    log('🔄 Manual refresh: No messages found', 'info');
                    displayMessages([]);
                    updateMessageCount(0);
                }
            }).catch((error) => {
                log(`❌ Manual refresh failed: ${error.message}`, 'error');
            });
        }

        // Initialize on page load
        window.onload = function() {
            log('🚀 Firebase Chat Test UI loaded', 'info');
            log('📋 Use Quick Connect: Enter User ID, Custom Token, and Event ID', 'info');
            log('🔑 Your backend already validated auth - Firebase will trust the custom token!', 'info');
            
            // Check for URL parameters (from multi-user tester)
            loadFromURL();
        };

        // Load credentials from URL parameters
        function loadFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            const userName = urlParams.get('userName');
            const token = urlParams.get('token');
            const eventId = urlParams.get('eventId');
            
            if (userId) {
                document.getElementById('quickUserId').value = userId;
                log(`📝 Pre-filled User ID: ${userId}`, 'info');
            }
            
            if (userName) {
                document.getElementById('quickDisplayName').value = userName;
                log(`📝 Pre-filled Display Name: ${userName}`, 'info');
            }
            
            if (token) {
                document.getElementById('quickToken').value = token;
                log(` Token`, 'info');
            }
            
            if (eventId) {
                document.getElementById('quickEventId').value = eventId;
                log(`📝 Pre-filled Event ID: ${eventId}`, 'info');
            }
            
            // If all parameters are present, auto-connect
            if (userId && token && eventId) {
                log('🚀 All credentials provided - attempting auto-connect...', 'info');
                setTimeout(() => {
                    quickConnect();
                }, 500);
            }
        }
    </script>
</body>
</html>
